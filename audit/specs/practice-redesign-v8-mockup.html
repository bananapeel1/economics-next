<title>Market Failure Paper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@1&display=swap">
<style>
/* Paper by default (founder, 26 Sep): the exam paper is white. Dark exists only when chosen explicitly. */
:root{
  --desk:#e8ebf0; --paper:#ffffff; --sheet-edge:#d6dbe3; --rule:#dde2ea; --hair:#e6e9ef; --tint:#f4f6f9;
  --ink:#111827; --ink-2:#374151; --muted:#5b6472;
  --accent:#036a4d; --accent-strong:#02503c; --accent-soft:rgba(5,150,105,.08); --on-accent:#fff;
  --pen:#9a4708; --pen-soft:rgba(154,71,8,.07);
  --fig:#1d4ed8; --fig-soft:rgba(29,78,216,.07);
  --shadow:0 1px 2px rgba(17,24,39,.06),0 8px 24px rgba(17,24,39,.05);
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  --serif:'DM Serif Display',Georgia,'Times New Roman',serif;
  --lh:32px; --gutter:24px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --desk:#0f1117; --paper:#171b28; --sheet-edge:#262c3f; --rule:#2a3045; --hair:#232838; --tint:#1c2132;
  --ink:#edf0f7; --ink-2:#cdd4e6; --muted:#8e9ab3;
  --accent:#10b981; --accent-strong:#34d399; --accent-soft:rgba(16,185,129,.1); --on-accent:#04130d;
  --pen:#dfaa55; --pen-soft:rgba(223,170,85,.08);
  --fig:#9db8ef; --fig-soft:rgba(96,165,250,.1);
  --shadow:0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-wrap:break-word}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.small{font-size:13px;line-height:1.5;color:var(--muted)}

/* ---------- one header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:16px;height:56px;padding:0 var(--gutter);background:var(--paper);border-bottom:1px solid var(--sheet-edge)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{display:flex;align-items:center;gap:8px;flex:none;color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;letter-spacing:-.01em;border-radius:6px;padding:2px 4px 2px 0}
.logo:hover .name{text-decoration:underline;text-underline-offset:4px}
.logo img{display:block;width:28px;height:28px}
.crumb-sep{color:var(--sheet-edge);flex:none}
.crumb{display:flex;gap:8px;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap}
.crumb b{color:var(--ink);font-weight:600}
.crumb .sep{color:var(--sheet-edge)}
.top .grow{flex:1}
.mode{display:flex;gap:2px;padding:3px;border-radius:8px;background:var(--tint);flex:none}
.mode button{padding:5px 12px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.mode button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(17,24,39,.08)}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--tint)}
.proto{position:relative;flex:none}
.proto>button{font-size:13px;color:var(--muted);padding:6px 10px;border-radius:8px;border:1px dashed var(--sheet-edge)}
.proto .menu{position:absolute;right:0;top:calc(100% + 6px);width:250px;padding:6px;background:var(--paper);border:1px solid var(--sheet-edge);border-radius:10px;box-shadow:var(--shadow);display:grid;z-index:40}
.proto .menu button{text-align:left;padding:8px 10px;border-radius:6px;font-size:13px;color:var(--ink-2)}
.proto .menu button:hover{background:var(--tint)}

/* ---------- desk layout ---------- */
.desk{display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;padding:28px var(--gutter) 48px;max-width:1500px;margin:0 auto;align-items:start}
.outline{position:sticky;top:84px;display:grid;gap:22px;font-size:13px}
.o-sec h3{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between;gap:8px}
.o-sec h3 span{color:var(--muted);font-weight:400}
.o-sec .o-note{color:var(--muted);margin:0 0 6px}
.o-q{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:baseline;width:100%;text-align:left;padding:6px 8px;border-radius:6px;color:var(--ink-2)}
.o-q:hover{background:var(--paper)}
.o-q[aria-current="true"]{background:var(--paper);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.o-q .n{font-weight:600}
.o-q .s{color:var(--muted);white-space:nowrap}
.o-q.done .s{color:var(--accent);font-weight:600}
.o-q.off{opacity:.55}
.o-link{color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-weight:500}
.o-total{border-top:1px solid var(--sheet-edge);padding-top:14px;color:var(--ink-2)}
.o-total b{font-size:20px;font-weight:600;color:var(--ink)}

.work{display:grid;gap:28px;grid-template-columns:minmax(0,1fr);align-items:start;min-width:0}
.work.with-booklet{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
.sheet{background:var(--paper);border:1px solid var(--sheet-edge);border-radius:4px;box-shadow:var(--shadow);min-width:0}
.work:not(.with-booklet) .qpaper{max-width:760px;justify-self:center;width:100%}
.booklet{position:sticky;top:84px;max-height:calc(100dvh - 112px);overflow:auto;overscroll-behavior:contain}

/* ---------- source booklet ---------- */
.b-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:18px 32px 0;flex-wrap:wrap}
.b-head .small b{color:var(--ink-2);font-weight:600}
.textsize{display:flex;gap:2px}
.textsize button{font-size:13px;color:var(--muted);padding:2px 8px;border-radius:6px}
.textsize button:hover{background:var(--tint)}
.b-body{padding:10px 32px 30px;font-size:var(--bsize,15.5px);line-height:1.7;color:var(--ink-2)}
.b-body h4{font-size:17px;line-height:1.4;margin:8px 0 14px;color:var(--ink);font-weight:600;text-wrap:balance}
.b-body p{margin:0 0 14px}
.fig{font:inherit;color:var(--ink);border-bottom:1.5px dotted color-mix(in srgb,var(--fig) 55%,transparent);padding:0 1px;border-radius:2px}
.fig:hover{background:var(--fig-soft)}
.fig.lit{background:var(--fig-soft);color:var(--fig);box-shadow:0 0 0 1px color-mix(in srgb,var(--fig) 40%,transparent)}
.tcap{font-weight:600;color:var(--ink);font-size:14px;margin:22px 0 8px}
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--ink);padding:8px 10px;border-bottom:1.5px solid var(--ink)}
td{padding:8px 10px;border-bottom:1px solid var(--hair);vertical-align:top}
td.num,th.num{text-align:right}
.tsrc{font-size:13px;color:var(--muted);margin-top:8px}

/* ---------- question paper ---------- */
.qpaper{padding:30px 40px 34px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1.5px solid var(--ink);padding-bottom:8px;margin-bottom:6px}
.sec-head h2{margin:0;font-size:20px;font-weight:700;letter-spacing:.01em}
.sec-head .small{color:var(--ink-2)}
.instr{margin:0 0 22px;font-size:13px;color:var(--muted)}
.context{margin:0 0 14px;color:var(--ink-2)}
.context table{max-width:420px}
.qline{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:baseline}
.qline .num{font-weight:700}
.qline .stem{margin:0;font-weight:500;text-wrap:pretty}
.qline .stem em{font-family:var(--serif);font-style:italic;font-weight:400;font-size:1.08em}
.qline .mk{font-weight:700;white-space:nowrap}
.qbody{margin-left:64px}
.lined{width:100%;display:block;margin-top:14px;border:0;resize:vertical;outline:none;color:var(--ink);font:400 16px/var(--lh) var(--sans);padding:0 2px;background:
  repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px),var(--rule) var(--lh));background-attachment:local}
.lined:focus{background-color:var(--tint)}
.script-answer{margin-top:14px;white-space:pre-wrap;color:var(--ink);font:400 16px/var(--lh) var(--sans);padding:0 2px;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px),var(--rule) var(--lh))}
.under{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong)}
.btn.quiet{color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--sheet-edge);text-underline-offset:4px;padding:9px 4px}
.saved{font-size:13px;color:var(--muted)}
.total-line{text-align:right;font-weight:700;margin:26px 0 0;font-size:14px}
.draw{margin-top:16px;padding:18px;border:1.5px dashed var(--sheet-edge);border-radius:6px;color:var(--ink-2);display:grid;gap:10px}
.essay-pick{display:grid;gap:18px}
.essay-card{padding:18px 0;border-top:1px solid var(--hair)}
.essay-card:first-child{border-top:0}
.quote{margin:0 0 10px;color:var(--ink-2);font-style:italic}

/* ---------- marking: Pearson's own formats ---------- */
.mark-block{margin-top:26px;padding-top:20px;border-top:1px solid var(--hair)}
.mark-block h3{margin:0 0 4px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.score{font-size:20px;font-weight:700}
.score small{font-size:14px;font-weight:500;color:var(--muted)}
.ao{margin:14px 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.pt{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--hair)}
.pt input{appearance:none;width:18px;height:18px;margin:3px 0 0;border:1.5px solid var(--sheet-edge);border-radius:4px;display:grid;place-items:center;cursor:pointer}
.pt input:checked{background:var(--accent);border-color:var(--accent)}
.pt input:checked::after{content:"";width:9px;height:5px;border:solid var(--on-accent);border-width:0 0 2px 2px;transform:translateY(-1px) rotate(-45deg)}
.pt label{cursor:pointer}
.pt .see{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.pt .see:hover{color:var(--ink)}
.levels{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
.levels td{padding:9px 10px;border-bottom:1px solid var(--hair);vertical-align:top}
.levels td:first-child{white-space:nowrap;font-weight:600;width:1%}
.levels td.band{white-space:nowrap;color:var(--muted);width:1%}
.levels tr{cursor:pointer}
.levels tr:hover td{background:var(--tint)}
.levels tr.on td{background:var(--accent-soft)}
.levels tr.on td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.pick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pick button{min-width:34px;padding:4px 8px;border:1px solid var(--sheet-edge);border-radius:6px;font-size:13px;font-weight:600;color:var(--ink-2);background:var(--paper)}
.pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.indic{margin:10px 0 0;padding-left:18px;color:var(--ink-2);font-size:14px}
.indic li{margin:3px 0}

/* the model answer as an examiner's exemplar */
.exemplar{margin-top:26px;padding-top:20px;border-top:1px solid var(--hair)}
.script{display:grid;grid-template-columns:minmax(0,1fr) 64px;column-gap:14px}
.script p{margin:0 0 12px;color:var(--ink-2)}
.seg{border-radius:2px;transition:background .2s}
.seg.lit{background:var(--accent-soft);box-shadow:0 1.5px 0 var(--accent)}
.seg.lit.missed{background:var(--pen-soft);box-shadow:0 1.5px 0 var(--pen)}
.margin{color:var(--pen);font-weight:700;font-size:13px;line-height:1.5;padding-top:3px;border-left:1px solid var(--hair);padding-left:10px}
.sumline{color:var(--pen);font-weight:700;margin:6px 0 0}
.examiner{margin-top:14px;padding:12px 14px;background:var(--pen-soft);border-radius:6px;color:var(--ink-2);font-size:14px}
.examiner b{color:var(--pen);display:block;margin-bottom:4px}
.note{grid-column:1/-1;margin:-4px 0 12px;font-size:14px;color:var(--ink-2);padding:8px 12px;border-left:2px solid var(--accent);background:var(--tint)}
.note.missed{border-left-color:var(--pen)}
.diagram{max-width:420px;margin:6px 0 12px}
.diagram svg{width:100%;height:auto;display:block}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:30px;padding-top:16px;border-top:1px solid var(--hair);flex-wrap:wrap}
.pager button{font-size:14px;font-weight:600;color:var(--ink-2)}
.pager button:disabled{opacity:.35;cursor:default}
.pager .next{color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);font-size:14px;padding:8px 14px;border-radius:8px;transition:opacity .18s,transform .18s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast,.seg{transition:none}}

/* ---------- smaller screens ---------- */
.m-bar,.m-tabs{display:none}
@media (max-width:1180px){.work.with-booklet{grid-template-columns:minmax(0,1fr)} .booklet{position:static;max-height:none}}
@media (max-width:980px){
  :root{--gutter:16px}
  .desk{grid-template-columns:minmax(0,1fr);padding-top:12px;gap:14px}
  .outline{display:none;position:static}
  .outline.open{display:grid;background:var(--paper);border:1px solid var(--sheet-edge);border-radius:8px;padding:14px}
  .m-bar{display:flex;gap:10px;align-items:center}
  .m-bar button{flex:1;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--paper);border:1px solid var(--sheet-edge);border-radius:8px;font-weight:600;text-align:left}
  .m-bar .small{font-weight:400}
  .m-tabs{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;background:var(--tint);border-radius:8px}
  .m-tabs button{padding:8px;border-radius:6px;font-weight:600;font-size:14px;color:var(--muted)}
  .m-tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(17,24,39,.08)}
  .work.with-booklet .booklet[data-tab="off"],.work.with-booklet .qpaper[data-tab="off"]{display:none}
  .qpaper{padding:22px 18px 26px}
  .b-head{padding:16px 18px 0}.b-body{padding:8px 18px 22px}
  .qline{grid-template-columns:40px minmax(0,1fr) auto;gap:8px}
  .qbody{margin-left:0}
  .script{grid-template-columns:minmax(0,1fr) 44px;column-gap:8px}
}
@media (max-width:640px){
  .crumb .hide-sm{display:none}
  .logo .name,.crumb-sep{display:none}
  .proto,#theme{display:none}
  .top{gap:10px}
  .mode button{padding:5px 9px}
}
</style>

<div class="b-body"><h4>Dubai expands single-use plastics ban as Gulf sugar tax debate returns</h4>
<p>The UAE's federal single-use plastics policy moved into its next phase in 2025. Restaurants, delivery platforms and supermarkets across Dubai and Abu Dhabi must now charge a minimum of ${F('charge','AED 0.25')} per plastic bag. Officials estimate that around ${F('11bn','11 billion')} single-use bags were used each year before the policy began tightening in 2024, and early Dubai Municipality data suggests consumption fell by ${F('45','approximately 45%')} in the first year of the charge.</p>
<p>A renewed debate has emerged in the Gulf Cooperation Council over excise taxes on sugary drinks. The UAE and Saudi Arabia already apply a ${F('50','50%')} excise on soft drinks and ${F('100','100%')} on energy drinks, introduced in 2017. A 2024 Ministry of Health review reported that per capita consumption of carbonated soft drinks fell by ${F('32','roughly 32%')} over the following seven years, though diabetes prevalence remains high at an estimated ${F('123','12.3%')} of adults. Analysts at Gulf Economic Review argue the rate is under-correcting, given healthcare costs linked to obesity and type-2 diabetes estimated at over ${F('25bn','USD 25 billion')} a year.</p>
<p>Critics argue the taxes are regressive, hitting lower-income expatriate workers hardest, and that producers have passed the cost on to consumers without reformulating their products.</p>

function got(q){
  const s=st.qs[q.id]; if(s.phase!=='mark') return null;

  // Section D: the choice comes first
  if(sec.choose && st.mode==='practise' && !st.essay){
    h+=`<div class="essay-pick">${sec.qs.map(e=>`<div class="essay-card"><p class="quote">${e.quote}</p>${stemHtml(e)}<div class="qbody"><div class="actions" style="margin-top:12px"><button type="button" class="btn primary" data-choose="${e.id}">Answer this question</button></div></div></div>`).join('')}</div>`;
    $('#qpaper').innerHTML=h+pagerHtml(); return;
  }
  if(q.quote) h+=`<p class="quote">${q.quote}</p>`;
  if(q.context) h+=`<div class="context">${q.context}</div>`;
  h+=stemHtml(q)+`<div class="qbody">`;
  const lines=LINES[q.marks]||8;
  if(st.mode==='answers'){
    h+=`<div class="mark-block"><h3>Mark scheme <span class="small">${q.marks} marks</span></h3>${schemeHtml(q,false)}</div>${exemplarHtml(q)}`;
  } else if(s.phase==='write'){
    if(q.draw){
      h+=`<div class="draw"><b>Draw this on paper.</b><span>Label your axes and curves as you would in the exam, then mark your diagram against the mark scheme.</span><div class="actions"><button type="button" class="btn primary" id="do-mark">I’ve drawn it: mark it</button></div></div>`;
    } else {
      h+=`<textarea class="lined" id="answer" aria-label="Your answer to ${q.part?'6'+q.part:'question '+q.n}" style="min-height:calc(var(--lh) * ${lines})" placeholder="">${esc(s.draft)}</textarea>
        <div class="under"><span class="saved" id="saved">${s.draft.trim()?'Saved':''}</span><div class="actions"><button type="button" class="btn quiet" id="do-reveal">Show the model answer</button><button type="button" class="btn primary" id="do-mark">Mark my answer</button></div></div>`;
    }
  } else {
    const g=got(q);
    if(!q.draw) h+=`<div class="script-answer" aria-label="Your answer">${esc(s.draft)}</div><div class="under"><span class="saved">Your answer</span><button type="button" class="btn quiet" id="do-edit">Edit my answer</button></div>`;
    if(s.phase==='mark'){
      h+=`<div class="mark-block"><h3>Mark scheme <span class="score">${g} <small>/ ${q.marks}</small></span></h3><p class="small" style="margin:0">${q.scheme.type==='points'?'Tick each point your answer makes.':'Choose the level your answer reaches in each part, then a mark within it.'}</p>${schemeHtml(q,true)}</div>`;
    } else {
      h+=`<div class="mark-block"><h3>Mark scheme <span class="small">not marked</span></h3>${schemeHtml(q,false)}<div class="actions" style="margin-top:12px"><button type="button" class="btn quiet" id="do-mark">Mark my answer after all</button></div></div>`;
    }
    h+=exemplarHtml(q);
  }
  h+=`</div>`;
  if(sec.total && ORDER.filter(o=>o.sec===sec).slice(-1)[0].q.id===q.id) h+=`<p class="total-line">${sec.total}</p>`;
  $('#qpaper').innerHTML=h+pagerHtml();
  const ta=$('#answer');
  if(ta){ ta.addEventListener('input',()=>{s.draft=ta.value; $('#saved').textContent='Saved'; renderOutline(); save();});
    ['keyup','click','select','focus'].forEach(e=>ta.addEventListener(e,()=>{s.caret=[ta.selectionStart,ta.selectionEnd]}));
    ta.addEventListener('input',grow); grow.call(ta); }
  applyFig();
}
function grow(){ this.style.height='auto'; this.style.height=Math.max(this.scrollHeight,parseFloat(getComputedStyle(this).minHeight))+'px'; }
function pagerHtml(){
  const i=ORDER.findIndex(o=>o.q.id===st.cur), p=ORDER[i-1], n=ORDER[i+1];
  const lab=o=>o.q.part?(o.q.n?o.q.n+o.q.part:'6'+o.q.part):o.q.n;
  return `<div class="pager"><button type="button" data-go="${p?p.q.id:''}" ${p?'':'disabled'}>← ${p?lab(p):''}</button><button type="button" class="next" data-go="${n?n.q.id:''}" ${n?'':'disabled'}>${n?`${lab(n)} ${n.q.cmd} →`:'End of paper'}</button></div>`;
}
function renderBooklet(){
  const {sec}=Q(st.cur), show=!!sec.booklet;
  const b=$('#booklet'); b.hidden=!show; $('#work').classList.toggle('with-booklet',show); $('#m-tabs').hidden=!show;
  if(show && !b.dataset.built){ b.innerHTML=BOOKLET; b.dataset.built='1'; }
  document.documentElement.style.setProperty('--bsize',(15.5+st.bsize*1.5)+'px');
  const small=matchMedia('(max-width:980px)').matches;
  b.dataset.tab = small&&st.tab!=='booklet'?'off':'on';
  $('#qpaper').dataset.tab = small&&show&&st.tab!=='paper'?'off':'on';
  $('#t-paper').setAttribute('aria-selected',String(st.tab==='paper')); $('#t-booklet').setAttribute('aria-selected',String(st.tab==='booklet'));
}
function render(){
  $('#m-practise').setAttribute('aria-pressed',String(st.mode==='practise'));
  $('#m-answers').setAttribute('aria-pressed',String(st.mode==='answers'));
  renderOutline(); renderBooklet(); renderPaper();
}
function applyFig(){ document.querySelectorAll('.fig').forEach(f=>f.classList.toggle('lit',!!st.fig&&f.dataset.fig===st.fig)); }
function reveal(el){
  if(!el) return;
  const box=el.closest('.booklet');
  if(box && !matchMedia('(max-width:1180px)').matches){ const r=el.getBoundingClientRect(),br=box.getBoundingClientRect(); box.scrollTo({top:box.scrollTop+(r.top-br.top)-br.height/2,behavior:'smooth'}); }
  else window.scrollTo({top:Math.max(0,el.getBoundingClientRect().top+window.scrollY-140),behavior:'smooth'});
}
let tt; function toast(m){const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2200);}
function go(id){ if(!id||id===st.cur) return; st.cur=id; st.lit=null; st.fig=null; st.tab='paper'; $('#outline').classList.remove('open'); render(); save(); window.scrollTo({top:0}); }

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const goEl=t.closest('[data-go]'); if(goEl){ go(goEl.dataset.go); return; }
  if(t.closest('#quiz-link')){ e.preventDefault(); toast('Opens this topic in the app; the six-question quiz is in its Quiz tab.'); return; }
  const fig=t.closest('.fig');
  if(fig){
    const inBooklet=!!fig.closest('.booklet'), s=st.qs[st.cur];
    if(inBooklet && st.mode==='practise' && s.phase==='write' && $('#answer')){
      const ta=$('#answer'), [a,b]=s.caret||[ta.value.length,ta.value.length], txt=fig.textContent.trim();
      const before=ta.value.slice(0,a), after=ta.value.slice(b), ins=(before&&!/\s$/.test(before)?' ':'')+txt;
      ta.value=before+ins+after; s.draft=ta.value; const pos=(before+ins).length; s.caret=[pos,pos]; ta.focus(); ta.setSelectionRange(pos,pos); grow.call(ta);
      save(); renderOutline(); toast(`Quoted ${txt}`); if(matchMedia('(max-width:980px)').matches){st.tab='paper'; renderBooklet();} return;
    }
    st.fig=st.fig===fig.dataset.fig?null:fig.dataset.fig; applyFig();
    if(st.fig){ const other=document.querySelector(inBooklet?`#qpaper .fig[data-fig="${st.fig}"]`:`#booklet .fig[data-fig="${st.fig}"]`); if(other){ if(!inBooklet&&matchMedia('(max-width:980px)').matches){st.tab='booklet';renderBooklet();} reveal(other);} else if(inBooklet) toast('The model answer for this part does not use that figure.'); }
    return;
  }
  const see=t.closest('[data-see]'); if(see){ st.lit=see.dataset.see; renderPaper(); const el=document.querySelector(`#qpaper [data-seg="${st.lit}"]`); if(el) window.scrollTo({top:Math.max(0,el.getBoundingClientRect().top+window.scrollY-160),behavior:'smooth'}); return; }
  const seg=t.closest('.seg'); if(seg){ st.lit=st.lit===seg.dataset.seg?null:seg.dataset.seg; renderPaper(); return; }
  const lv=t.closest('.levels tr'); if(lv && st.mode==='practise' && st.qs[st.cur].phase==='mark'){ const s=st.qs[st.cur]; s.lv[lv.dataset.strand]=+lv.dataset.lo; renderPaper(); renderOutline(); save(); return; }
  const mk=t.closest('.pick button'); if(mk){ const s=st.qs[st.cur]; s.lv[mk.dataset.strand]=+mk.dataset.mark; renderPaper(); renderOutline(); save(); return; }
  const ch=t.closest('[data-choose]'); if(ch){ st.essay=ch.dataset.choose; st.cur=ch.dataset.choose; render(); save(); return; }
  const id=t.closest('button')&&t.closest('button').id;
  if(id==='do-mark'){ const s=st.qs[st.cur]; if(!s.draft.trim() && !Q(st.cur).q.draw){ toast('Write your answer first, or show the model answer.'); return;} s.phase='mark'; render(); save(); return; }
  if(id==='do-reveal'){ st.qs[st.cur].phase='reveal'; render(); save(); return; }
  if(id==='do-edit'){ st.qs[st.cur].phase='write'; render(); save(); $('#answer')&&$('#answer').focus(); return; }
  if(id==='m-practise'){ st.mode='practise'; st.lit=null; render(); save(); return; }
  if(id==='m-answers'){ st.mode='answers'; st.lit=null; render(); save(); return; }
  if(id==='t-paper'){ st.tab='paper'; renderBooklet(); return; }
  if(id==='t-booklet'){ st.tab='booklet'; renderBooklet(); return; }
  if(id==='ts-up'){ st.bsize=Math.min(3,st.bsize+1); renderBooklet(); save(); return; }
  if(id==='ts-down'){ st.bsize=Math.max(-1,st.bsize-1); renderBooklet(); save(); return; }
  if(id==='m-outline'){ const o=$('#outline'); o.classList.toggle('open'); t.closest('button').setAttribute('aria-expanded',String(o.classList.contains('open'))); return; }
  if(id==='theme'){ const r=document.documentElement; r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'; return; }
  if(id==='proto-btn'){ const m=$('#proto-menu'); m.hidden=!m.hidden; $('#proto-btn').setAttribute('aria-expanded',String(!m.hidden)); return; }
  const j=t.closest('[data-jump]'); if(j){ $('#proto-menu').hidden=true; const k=j.dataset.jump;
    if(k==='reset'){ st=fresh(); ORDER.forEach(({q})=>st.qs[q.id]={phase:'write',draft:'',ticks:[],lv:{}}); st.cur='b1'; st.lit=null; }
    if(k==='6c'){ st.mode='practise'; st.cur='6c'; st.qs['6c'].phase='mark'; st.lit='c2'; }
    if(k==='6a-write'){ st.mode='practise'; st.cur='6a'; st.qs['6a'].phase='write'; }
    if(k==='6e'){ st.mode='practise'; st.cur='6e'; st.qs['6e'].phase='mark'; if(!st.qs['6e'].lv[0]) st.qs['6e'].lv={0:6,1:3}; }
    if(k==='b2'){ st.mode='practise'; st.cur='b2'; st.qs.b2.phase='write'; }
    if(k==='d'){ st.mode='practise'; st.essay=null; st.cur='d7'; }
    if(k==='answers'){ st.mode='answers'; st.cur='6e'; }
    render(); save(); window.scrollTo({top:0}); return; }
});
document.addEventListener('change',e=>{ const c=e.target.closest('[data-tick]'); if(!c) return; const s=st.qs[st.cur], pid=c.dataset.tick;
  s.ticks=c.checked?[...new Set([...s.ticks,pid])]:s.ticks.filter(x=>x!==pid);
  const q=Q(st.cur).q; q.scheme.groups.forEach(g=>g.pts.forEach(([p,,seg])=>{ if(p===pid) st.lit=seg; }));
  renderPaper(); renderOutline(); save(); document.getElementById(`ck-${st.cur}-${pid}`)&&document.getElementById(`ck-${st.cur}-${pid}`).focus(); });
document.addEventListener('keydown',e=>{ if(e.target.matches('textarea,input')||e.metaKey||e.ctrlKey||e.altKey) return;
  const i=ORDER.findIndex(o=>o.q.id===st.cur);
  if(e.key==='ArrowRight'&&ORDER[i+1]){e.preventDefault();go(ORDER[i+1].q.id);} if(e.key==='ArrowLeft'&&ORDER[i-1]){e.preventDefault();go(ORDER[i-1].q.id);} });
matchMedia('(max-width:980px)').addEventListener('change',renderBooklet);
render();
})();
</script>
