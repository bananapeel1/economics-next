<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" role="img" aria-labelledby="title desc">
  <title id="title">Positive externality in consumption — welfare loss</title>
  <desc id="desc">Marginal private benefit (MPB) lies below marginal social benefit (MSB). The free market settles at Q1 and P1, where MPB meets supply (MPC = MSC). The social optimum Q* is where MSB meets MSC, at a larger quantity and a higher price P*. The shaded triangle between MSB and MSC from Q1 to Q* is the deadweight welfare loss of under-consumption.</desc>
  <style>
    .axis { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #1f2937; }
    .axis-title { font-size: 14px; font-weight: 600; }
    .label { font-size: 13px; font-weight: 600; }
    .note { font-size: 12px; fill: #475569; }
    .s { fill: none; stroke: #ef4444; stroke-width: 2.5; }
    .mpb { fill: none; stroke: #4f46e5; stroke-width: 2.5; }
    .msb { fill: none; stroke: #10b981; stroke-width: 2.5; }
    .dashed { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .dwl { fill: #f59e0b; fill-opacity: 0.35; stroke: #d97706; stroke-width: 1; }
    .dot { fill: #111827; }
  </style>

  <line class="axis" x1="70" y1="50" x2="70" y2="350" />
  <line class="axis" x1="70" y1="350" x2="470" y2="350" />
  <text class="text axis-title" x="50" y="45">Price, Benefit</text>
  <text class="text axis-title" x="465" y="375" text-anchor="end">Quantity (Q)</text>

  <line class="s" x1="100" y1="320" x2="440" y2="80" />
  <line class="mpb" x1="100" y1="120" x2="400" y2="340" />
  <line class="msb" x1="150" y1="80" x2="440" y2="300" />

  <!-- Q1/P1 = S ∩ MPB = (238.96, 221.91); Q*/P* = S ∩ MSB = (289.78, 186.04); MSB at Q1 = 147.49.
       Computed from the three line segments above; the welfare loss is bounded by MSB (top) and MSC (bottom). -->
  <polygon class="dwl" points="238.96,221.91 238.96,147.49 289.78,186.04" />

  <circle class="dot" cx="238.96" cy="221.91" r="4" />
  <circle class="dot" cx="289.78" cy="186.04" r="4" />

  <line class="dashed" x1="70" y1="221.91" x2="238.96" y2="221.91" />
  <line class="dashed" x1="238.96" y1="350" x2="238.96" y2="221.91" />
  <line class="dashed" x1="70" y1="186.04" x2="289.78" y2="186.04" />
  <line class="dashed" x1="289.78" y1="350" x2="289.78" y2="186.04" />

  <text class="text label" x="62" y="226" text-anchor="end">P1</text>
  <text class="text label" x="62" y="190" text-anchor="end">P*</text>
  <text class="text label" x="238.96" y="368" text-anchor="middle">Q1</text>
  <text class="text label" x="289.78" y="368" text-anchor="middle">Q*</text>

  <text class="text label" x="446" y="80" fill="#ef4444">MPC = MSC</text>
  <text class="text label" x="405" y="338" fill="#4f46e5">MPB</text>
  <text class="text label" x="446" y="300" fill="#10b981">MSB</text>

  <text class="text note" x="246" y="121">Deadweight</text>
  <text class="text note" x="246" y="136">loss</text>

  <text class="text note" x="250" y="396" text-anchor="middle">Free market under-consumes: Q1 &lt; social optimum Q*.</text>
</svg>
